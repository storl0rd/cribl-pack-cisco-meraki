meraki_securityappliances:
  type: collection
  ttl: 4h
  ignoreGroupJobsLimit: false
  removeFields: []
  resumeOnBoot: false
  description: 'meraki:securityappliances - MX/Z event log (DHCP, IDS, VPN, content filtering) (TA input: cisco_meraki_securityappliances)'
  schedule:
    enabled: false
    cronSchedule: '*/5 * * * *'
    maxConcurrentRuns: 1
    skippable: true
    resumeMissed: false
    run:
      rescheduleDroppedTasks: true
      maxTaskReschedule: 1
      logLevel: info
      jobTimeout: '0'
      mode: run
      timeRangeType: relative
      earliest: -10m@m
      latest: -5m@m
      timestampTimezone: UTC
      timeWarning: {}
      expression: 'true'
      minTaskSize: 1MB
      maxTaskSize: 10MB
  streamtags:
  - meraki
  workerAffinity: false
  collector:
    type: rest
    conf:
      discovery:
        discoverType: http
        discoverMethod: get
        discoverUrl: '`https://${C.vars.meraki_api_host}/api/v1/organizations/${C.vars.meraki_org_id}/networks`'
        discoverRequestParams:
        - name: perPage
          value: '''100000'''
        - name: productTypes[]
          value: '''appliance'''
        discoverRequestHeaders:
        - name: Accept
          value: '''application/json'''
        discoverDataField: ''
      collectMethod: get
      collectUrl: '`https://${C.vars.meraki_api_host}/api/v1/networks/${id}/events`'
      collectRequestParams:
      - name: perPage
        value: '''1000'''
      - name: productType
        value: '''appliance'''
      - name: startingAfter
        value: 'new Date((earliest ? earliest : Date.now() / 1000 - 3600) * 1000).toISOString()'
      - name: endingBefore
        value: 'new Date((latest ? latest : Date.now() / 1000) * 1000).toISOString()'
      collectRequestHeaders:
      - name: Accept
        value: '''application/json'''
      authentication: tokenSecret
      tokenSecret: meraki_api_key
      pagination:
        type: response_header_link
        nextRelationAttribute: next
        maxPages: 0
      timeout: 120
      useRoundRobinDns: false
      disableTimeFilter: true
      decodeUrl: true
      rejectUnauthorized: true
      captureHeaders: false
      stopOnEmptyResults: true
      safeHeaders: []
      retryRules:
        type: backoff
        interval: 1000
        limit: 6
        multiplier: 2
        codes:
        - 429
        - 502
        - 503
        - 504
        enableHeader: true
        retryConnectTimeout: true
        retryConnectReset: true
    destructive: false
  input:
    type: collection
    staleChannelFlushMs: 10000
    sendToRoutes: true
    preprocess:
      disabled: true
    throttleRatePerSec: '0'
    breakerRulesets:
    - meraki_json_document
    metadata:
    - name: sourcetype
      value: '''meraki:securityappliances'''
    - name: __meraki_kind
      value: '''api'''
